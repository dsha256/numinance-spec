// Envelope is the wire form of the Engine's kernel event envelope: the same fields with the same names and rules, plus producer. It is carried by every published event.
// Reference-only rule: payloads carry ids, references, digests, enum codes and timestamps, never content: no source, diffs, tickets, prompts, completions, logs, findings bodies or secrets.
// payload holds exactly one numinance.events.v1 message: type URL type.numinance.dev/numinance.events.v1.<Fact> for event type <Fact>.v1, on the kernel allow-list, with payload.value at most 16384 bytes. A consumer checks the type URL and the length after decoding this envelope and before decoding the payload; a transport bounds the whole envelope by its maximum receive size.
syntax = "proto3";

package numinance.events.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "numinance/annotations/v1/annotations.proto";
import "numinance/types/v1/types.proto";

// Envelope wraps one published event with its routing and replay metadata.
message Envelope {
  // Unique id of this event instance, evt_ prefixed.
  string id = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Event name in the form <Fact>.v<major>, at most 128 bytes.
  string type = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
  // When the fact occurred, UTC.
  google.protobuf.Timestamp occurred_at = 3 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Tenant the event belongs to, ten_ prefixed.
  string tenant = 4 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Aggregate the event is about (chg_ for Change events); required, printable ASCII, at most 256 bytes.
  string aggregate_id = 5 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Key that groups events of one flow; optional, printable ASCII, at most 256 bytes.
  string correlation_key = 6 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Key consumers use to tolerate replay; optional, printable ASCII, at most 256 bytes.
  string idempotency_key = 7 [(numinance.annotations.v1.field).since = "1.0.0"];
  // The event payload; see the file comment for the type URL and size rules.
  google.protobuf.Any payload = 8 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Identity kind that published the event, set by the host from the verified transport identity, never from the payload; the kind listed for the event on the kernel allow-list, RUNNER for every event in v1. Not the publishing context: the outbox checks that a context publishes only its own facts.
  numinance.types.v1.PrincipalKind producer = 9 [(numinance.annotations.v1.field).since = "1.0.0"];
}
