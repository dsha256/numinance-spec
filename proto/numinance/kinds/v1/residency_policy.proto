// Key spelling, json_name and the checks the loader adds to the schema: see meta.proto.
syntax = "proto3";

package numinance.kinds.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "numinance/annotations/v1/annotations.proto";
import "numinance/kinds/v1/meta.proto";
import "numinance/types/v1/types.proto";

// ResidencyPolicy says where execution and inference may happen: the class derived from the executor's live
// configuration must meet every floor that applies, or the Change is refused at start (ADR 0019).
message ResidencyPolicy {
  // api_version is required and is "numinance.dev/v1".
  string api_version = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // kind is required and is "ResidencyPolicy".
  string kind = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
  // metadata is required; the loader enforces it, the schema cannot.
  Metadata metadata = 3 [(numinance.annotations.v1.field).since = "1.0.0"];
  // spec is required; the loader enforces it, the schema cannot.
  ResidencyPolicySpec spec = 4 [(numinance.annotations.v1.field).since = "1.0.0"];
  // extensions holds vendor or customer data under reverse-DNS keys; the Engine never reads it.
  map<string, google.protobuf.Value> extensions = 5 [(numinance.annotations.v1.field).since = "1.0.0"];
}

// ResidencyPolicySpec holds the floors and the data-handling limits. Floor is the ResidencyFloors message with the five ADR 0019 classes (no IN_REGION or ANY value);
// inference residency is carried by floors (the derived class covers inference, ADR 0019) together with cross_region.
// training_use is a separate optional enum.
message ResidencyPolicySpec {
  // floors are the residency floors; only an org-scoped kind or a control pack may set them. Absent in the org means
  // the floor IN_ACCOUNT, which pack floors add to and never displace; an org lowers it only by writing one.
  ResidencyFloors floors = 1 [(merge) = MERGE_DIRECTIVE_FORBID, (numinance.annotations.v1.field).since = "1.0.0"];
  // regions is required and non-empty: the allowed source and destination regions, each one region name ("*" is
  // refused). A list cannot carry FORBID, so the profile context refuses it below the org scope until tighten-only.
  repeated string regions = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
  // cross_region is true when inference may run in a region other than the source region; absent means false.
  optional bool cross_region = 3 [json_name = "cross_region", (merge) = MERGE_DIRECTIVE_FORBID, (numinance.annotations.v1.field).since = "1.0.0"];
  // retention_max is the longest a model vendor may retain prompts and responses; absent means no retention.
  google.protobuf.Duration retention_max = 4 [json_name = "retention_max", (merge) = MERGE_DIRECTIVE_FORBID, (numinance.annotations.v1.field).since = "1.0.0"];
  // require_customer_keying is true when data at rest must be encrypted with customer-managed keys; absent means false.
  optional bool require_customer_keying = 5 [json_name = "require_customer_keying", (merge) = MERGE_DIRECTIVE_FORBID, (numinance.annotations.v1.field).since = "1.0.0"];
  // training_use says whether a model vendor may train on prompts and responses (ADR 0019). Absent means TRAINING_USE_FORBIDDEN; it is optional so that no document that omits it changes meaning. Setting TRAINING_USE_ALLOWED
  // widens what is permitted, so like the other limits it carries FORBID and only the org sets it.
  optional TrainingUse training_use = 6 [json_name = "training_use", (merge) = MERGE_DIRECTIVE_FORBID, (numinance.annotations.v1.field).since = "1.0.0"];
}

// TrainingUse is whether a model vendor may train on the data of a Change. This enum may grow. It is the policy-side
// permission; the executor-side dimension of ADR 0019 keeps its own type in types/v1 and must not retype
// or reuse field 6 of ResidencyPolicySpec.
enum TrainingUse {
  // TRAINING_USE_UNSPECIFIED is the zero value; a loader rejects it, so an explicit value is never a silent default.
  TRAINING_USE_UNSPECIFIED = 0;
  // TRAINING_USE_FORBIDDEN means the vendor may not train; it is what an absent training_use means.
  TRAINING_USE_FORBIDDEN = 1;
  // TRAINING_USE_ALLOWED means the vendor may train on prompts and responses.
  TRAINING_USE_ALLOWED = 2;
}

// ResidencyFloors is the set of floors; it is one message so the whole set carries the FORBID directive.
message ResidencyFloors {
  // floor is required: it applies to every change, together with every matching rule's floor.
  numinance.types.v1.ResidencyClass floor = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // rules add floors per component and environment; a rule never relaxes floor.
  repeated ResidencyRule rules = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
}

// ResidencyMatch selects changes; an absent key matches every value and an empty match matches every change, and a
// key the change has no value for counts as a match. Floors from the org and control packs all hold together.
message ResidencyMatch {
  // component is the name of the component the change touches. It is not a security boundary until floors match only
  // components of an org-owned SIGNED_POLICY registry, since a repo can rename one.
  optional string component = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // environment is the name of the environment the change acts in.
  optional string environment = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
}

// ResidencyRule adds a floor for the changes it matches.
message ResidencyRule {
  // match is required; the loader enforces it, the schema cannot.
  ResidencyMatch match = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // floor is required.
  numinance.types.v1.ResidencyClass floor = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
}
