// Configuration kinds: the customer-owned YAML objects under .numinance/.
//
// Every kind is one message with the same envelope: api_version, kind,
// metadata, spec and extensions. YAML files are validated against the JSON
// Schema generated from these messages; an unknown field is an error except
// under extensions. YAML spells the envelope key apiVersion (the default JSON
// name of api_version) and every other key in proto snake_case: a field with
// more than one word sets json_name to its own name, and a test in
// numinance-spec/schemas enforces it. Enum values are spelled by their full
// proto name (SCOPE_ORG) and durations in the proto JSON form ("7200s"). The generated schema is the first gate; the
// loader is the second and also enforces what proto3 and the schema cannot:
// metadata and spec present, scope not SCOPE_UNSPECIFIED, apiVersion and kind
// equal to their constants, required lists non-empty and extensions keys
// reverse-DNS; each new kind adds checks, listed in sdk/go/kindyaml/README.md.
// 64-bit integers are avoided in kinds: protojson writes them as
// strings, which the strict schema rejects.
syntax = "proto3";

package numinance.kinds.v1;

import "google/protobuf/descriptor.proto";
import "numinance/annotations/v1/annotations.proto";

// MergeDirective says how profile resolution merges a field across org, repo
// and component scope; it is declared with the merge field option, only on
// fields reached from spec through singular messages. This enum may grow: a resolver that does not know a value refuses the profile.
enum MergeDirective {
  // MERGE_DIRECTIVE_UNSPECIFIED is the default of a field without the option:
  // a singular numinance message merges field by field, and any other field
  // (scalar, enum, list, map, well-known type) is replaced; a oneof is replaced as a unit.
  MERGE_DIRECTIVE_UNSPECIFIED = 0;
  // MERGE_DIRECTIVE_REPLACE replaces the whole value, a message included, with the narrower scope's value.
  MERGE_DIRECTIVE_REPLACE = 1;
  // MERGE_DIRECTIVE_APPEND keeps the wider scope's names, then adds the
  // narrower scope's names not already present; only on repeated string fields.
  MERGE_DIRECTIVE_APPEND = 2;
  // MERGE_DIRECTIVE_FORBID marks a floor: only a kind loaded from the org scope (not
  // its own metadata.scope) or a control pack may set it; a narrower scope fails validation. Only on a
  // field with presence (never a list, map or oneof member) and never below a REPLACE parent.
  MERGE_DIRECTIVE_FORBID = 3;
}

extend google.protobuf.FieldOptions {
  // merge is the merge directive of a kind field. 50001 and 50002 are taken
  // by numinance.annotations.v1; 50003 is this option.
  MergeDirective merge = 50003 [(numinance.annotations.v1.field).since = "1.0.0"];
}

// Scope is the level a kind applies at; resolution loads org, then repo, then component.
enum Scope {
  // SCOPE_UNSPECIFIED is the zero value; a loader rejects it.
  SCOPE_UNSPECIFIED = 0;
  // SCOPE_ORG applies to every repository of the organisation; only org-scoped kinds may set floors.
  SCOPE_ORG = 1;
  // SCOPE_REPO applies to one repository.
  SCOPE_REPO = 2;
  // SCOPE_COMPONENT applies to one component of a repository.
  SCOPE_COMPONENT = 3;
}

// Metadata names a kind object and fixes its scope.
message Metadata {
  // name is required and unique per kind and scope; other kinds reference the object by it.
  string name = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // scope is required and not SCOPE_UNSPECIFIED; the loader enforces the latter.
  Scope scope = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
}
