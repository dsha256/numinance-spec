// InclusionProof lets an offline `numi evidence verify` check that a leaf is committed to a TransparencyLog checkpoint, so a wholesale re-signed bundle is detected.
// A leaf is exactly 33 bytes: one kind byte then the raw 32-byte hash; kind 0x48 ("H") for a chain head (head_record_hash) and 0x41 ("A") for an attestation leaf (sha256 of the canonical Attestation with signature empty). A verifier rejects any other length or kind.
// The tree hashes as RFC 6962: leaf_hash = sha256(0x00 || leaf), node_hash = sha256(0x01 || left || right). The root is the checkpoint's; the message that carries the proof references the checkpoint by checkpoint_ref, a claim-check reference to a checkpoint artifact carrying the log origin, tree_size, the root hash and the TransparencyLog's signature over them (the transparencylog port declares its artifact_type).
// A proof is evidence only against a checkpoint authenticated independently of the runner key (the log signing key or an exported witness); the transparencylog port defines that anchor. A bundle that carries its own log, checkpoint and keys proves nothing.
// Bounds a decoder enforces before verifying: the encoded proof is at most 8192 bytes in the canonical form of record.proto (an empty audit_path is an absent key); unknown, duplicate and case-variant keys are rejected; audit_path is refused at its 65th entry while it is read; tree_size is 1 to 2^53-1; leaf_index is below tree_size and the path has exactly the length (leaf_index, tree_size) implies, with no empty entry. The checkpoint is the evidence/v1 Checkpoint message (checkpoint.proto).
syntax = "proto3";

package numinance.evidence.v1;

import "numinance/annotations/v1/annotations.proto";
import "numinance/types/v1/types.proto";

// InclusionProof is a Merkle audit path (RFC 6962 section 2.1.1) from one leaf to the checkpoint root.
message InclusionProof {
  // 0-based index of the leaf in the log tree.
  uint64 leaf_index = 1 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Size of the tree the checkpoint commits to; leaf_index is below it, and it must equal the checkpoint's tree_size and a verifier rejects a mismatch.
  uint64 tree_size = 2 [(numinance.annotations.v1.field).since = "1.0.0"];
  // Sibling hashes from the leaf up to the root, each a sha256 node hash; at most 64 entries, and a verifier rejects a proof whose length is not the one implied by (leaf_index, tree_size).
  repeated numinance.types.v1.Digest audit_path = 3 [(numinance.annotations.v1.field).since = "1.0.0"];
}
